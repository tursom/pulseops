# ===========================================================================
# PulseOps 配置文件
# ===========================================================================
# 使用方式: 复制本文件为 configs/pulseops.toml，按需修改
#   cp configs/pulseops.example.toml configs/pulseops.toml
#
# 运行时指定: 启动 pulseops 时通过参数传入本文件路径
# ===========================================================================

# -----------------------------------------------------------------
# [server]  HTTP 服务配置
# -----------------------------------------------------------------
[server]
# 监听地址，格式: host:port
addr = ":8080"
# 请求读取超时（Go duration 格式: 1s / 1m / 1h）
read_timeout = "5s"
# 响应写入超时
write_timeout = "10s"

# -----------------------------------------------------------------
# [task]  任务调度与默认值
# -----------------------------------------------------------------
[task]
# 任务配置文件目录，此目录下的 .toml 文件会被自动加载为任务
config_dir = "configs/tasks"
# 配置文件热重载去抖动间隔，避免频繁修改导致重复加载
reload_debounce = "500ms"
# 任务默认执行超时（单个任务未设置 timeout 时使用此值）
default_timeout = "10s"
# 默认 trace 记录级别
# 可选值: none（不记录）| summary（仅摘要，默认）| detail（含载荷）| debug（完整记录）
default_trace_level = "summary"

# -----------------------------------------------------------------
# [state]  状态存储（目前仅支持 PostgreSQL）
# -----------------------------------------------------------------
[state]
# 存储后端，目前仅支持 "postgres"
backend = "postgres"
# PostgreSQL 连接串
# 格式: postgres://用户名:密码@主机:端口/库名?参数
# 推荐生产环境设置: ?sslmode=require&connect_timeout=5
dsn = "postgres://pulseops:secret@127.0.0.1:5432/pulseops?sslmode=disable"

# -----------------------------------------------------------------
# [artifact_store]  大对象存储（S3 兼容协议）
# -----------------------------------------------------------------
[artifact_store]
# 存储类型，目前仅支持 "s3"
kind = "s3"
# 对象存储提供方，用于内部标记
provider = "minio"
# 存储桶名称
bucket = "pulseops-artifacts"
# S3 兼容 API 端点地址
endpoint = "http://127.0.0.1:9000"
# 区域标识
region = "auto"
# 对象键基础路径，可用于区分环境（如 "prod" / "staging"）
base_path = "local"
# 是否使用路径寻址风格（MinIO 需要设为 true）
force_path_style = true
# 预签名 URL 有效期
presign_ttl = "15m"
# 访问密钥
access_key = "minioadmin"
# 私有密钥
secret_key = "minioadmin"
# 是否使用 HTTPS
use_ssl = false

# -----------------------------------------------------------------
# [trace.sinks]  Trace 记录投递目标
# -----------------------------------------------------------------
# 每个 sink 一个独立段，段名 [trace.sinks.xxx] 中的 xxx 是 sink 的名称
# 支持的 sink 类型: postgres | webhook

# 示例 1: PostgreSQL sink —— 将任务执行记录写入数据库
# postgres sink 自动复用 [state].dsn，无需再次配置 dsn
[trace.sinks.postgres_main]
kind = "postgres"

# 示例 2: Webhook sink —— 每次任务执行后 POST JSON 到外部服务
[trace.sinks.webhook_audit]
kind = "webhook"
# POST 目标 URL，body 为 RunRecord 的 JSON 序列化
url = "http://127.0.0.1:18080/internal/task-trace"
# webhook 请求超时
timeout = "3s"

# -----------------------------------------------------------------
# [ai]  AI 分析功能配置（可选）
# -----------------------------------------------------------------
# 启用 AI 分析后，可以使用 ai_analyze 任务类型创建 AI 驱动的诊断和趋势分析
[ai]
# 是否启用 AI 功能。默认 false，设为 true 开启
enabled = false
# DeepSeek / OpenAI 兼容 API 端点地址
# DeepSeek 示例: http://127.0.0.1:8000/v1
# OpenAI 示例: https://api.openai.com/v1
endpoint = "http://127.0.0.1:8000/v1"
# API 密钥
api_key = ""
# 使用的模型名称
# DeepSeek: deepseek-chat / deepseek-reasoner
# OpenAI:  gpt-4o / gpt-4o-mini
model = "deepseek-chat"
# AI 调用默认超时
default_timeout = "30s"
# 最大生成 token 数
max_tokens = 4096
# 温度参数 (0-2)，越低输出越确定，推荐诊断场景使用 0.1
temperature = 0.1
